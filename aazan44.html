<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Srinagar Azan & Jamat Board (Hanafi)</title>
<style>
  :root{--bg:#071214;--accent:#00c853;--muted:#9aa7a6;font-family:"Segoe UI",Arial,sans-serif}
  body{margin:0;background:#021014;color:#e8f6ef}
  .container{max-width:900px;margin:20px auto;padding:20px;background:rgba(0,0,0,0.25);border-radius:10px}
  .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .clock{font-size:52px;font-weight:bold;color:#ff3b3b}
  .prayertable{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
  table{width:100%;border-collapse:collapse}
  td,th{padding:8px;text-align:left}
  th{color:var(--muted)}
  .azan{color:#f6f1ff;font-size:18px}
  .jamat{color:#ffd166;font-size:18px}
  .next{background:rgba(0,200,83,0.1);border-left:4px solid var(--accent)}
  .countdown{margin-top:10px;font-size:18px}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <div>
      <div class="clock" id="currentClock">--:--:--</div>
      <div id="currentDate"></div>
    </div>
    <div id="nextLabel" class="countdown">Next: —</div>
  </div>

  <div class="prayertable">
    <div>
      <h3>Azan Times</h3>
      <table id="azanTable"><tbody></tbody></table>
    </div>
    <div>
      <h3>Jamat Times</h3>
      <table id="jamatTable"><tbody></tbody></table>
    </div>
  </div>
</div>

<script>
// ---------- Config ----------
const prayersOrder = ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha','Sunset'];

// Fallback sample for Srinagar
const sampleTimes = { 
  Fajr:"04:53", Sunrise:"06:17", Dhuhr:"13:00", Asr:"16:47", Maghrib:"18:32", Isha:"19:56", Sunset:"18:32"
};

// ---------- Helpers ----------
function pad(n){return n.toString().padStart(2,'0');}
function format12h(date){
  let h=date.getHours(), m=pad(date.getMinutes());
  let ampm = h>=12?"PM":"AM";
  h=h%12; if(h===0) h=12;
  return `${h}:${m} ${ampm}`;
}
function toDate(timeStr){
  const [h,m]=timeStr.split(":").map(Number);
  const now=new Date();
  return new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0,0);
}

// ---------- Adjusted Azan Times ----------
function adjustAzan(azan){
  const adjusted={...azan};
  adjusted.Asr = new Date(toDate(azan.Asr).getTime()+51*60000);   // +51 mins
  adjusted.Maghrib = new Date(toDate(azan.Maghrib).getTime()+3*60000); // +3 mins
  adjusted.Fajr = toDate(azan.Fajr);
  adjusted.Sunrise = toDate(azan.Sunrise);
  adjusted.Dhuhr = new Date(new Date().setHours(13,0,0,0)); // fixed 1:00 PM
  adjusted.Isha = toDate(azan.Isha);
  adjusted.Sunset = toDate(azan.Sunset);
  return adjusted;
}

// ---------- Jamat rules ----------
function applyJamatRules(adjustedAzan){
  return {
    Fajr:new Date(adjustedAzan.Fajr.getTime()+40*60000),
    Dhuhr:new Date(new Date().setHours(13,15,0,0)), // fixed 1:15 PM
    Asr:new Date(adjustedAzan.Asr.getTime()+10*60000), 
    Maghrib:new Date(adjustedAzan.Maghrib.getTime()+6*60000), 
    Isha:new Date(adjustedAzan.Isha.getTime()+10*60000)
  };
}

// ---------- UI ----------
const azanTbody=document.querySelector('#azanTable tbody');
const jamatTbody=document.querySelector('#jamatTable tbody');
const clockNode=document.getElementById('currentClock');
const dateNode=document.getElementById('currentDate');
const nextLabel=document.getElementById('nextLabel');

let todaysAzan={}, todaysJamat={}, currentDay=null;

// Render tables
function renderTables(azan,jamat){
  azanTbody.innerHTML=''; jamatTbody.innerHTML='';
  todaysAzan={}; todaysJamat=jamat;

  for(const p of prayersOrder){
    if(!azan[p]) continue; 
    const az=(azan[p] instanceof Date)?azan[p]:toDate(azan[p]); 
    todaysAzan[p]=az;

    azanTbody.innerHTML+=`<tr data-p="${p}"><td>${p}</td><td class="azan">${format12h(az)}</td></tr>`;
  }

  // only show 5 prayers in Jamat table
  ['Fajr','Dhuhr','Asr','Maghrib','Isha'].forEach(p=>{
    const jm=jamat[p];
    jamatTbody.innerHTML+=`<tr data-p="${p}"><td>${p}</td><td class="jamat">${format12h(jm)}</td></tr>`;
  });
}

// Update clock + next prayer + midnight refresh
function updateClock(){
  const now=new Date();
  clockNode.textContent=format12h(now)+":"+pad(now.getSeconds());
  dateNode.textContent=now.toDateString();

  // detect day change → reload prayer times
  const todayDay=now.getDate();
  if(currentDay!==todayDay){
    currentDay=todayDay;
    loadTimes(); // re-fetch new day timings
    return; // skip countdown this tick to avoid flicker
  }

  let nextP=null, nextT=null;
  for(const p of ['Fajr','Dhuhr','Asr','Maghrib','Isha']){
    if(todaysAzan[p] && todaysAzan[p]>now){nextP=p;nextT=todaysAzan[p];break;}
  }
  if(!nextP){nextP="Fajr";nextT=new Date(todaysAzan.Fajr.getTime()+24*60*60000);}
  document.querySelectorAll("tr").forEach(r=>r.classList.remove("next"));
  document.querySelector(`#azanTable tr[data-p="${nextP}"]`)?.classList.add("next");
  document.querySelector(`#jamatTable tr[data-p="${nextP}"]`)?.classList.add("next");

  const diff=Math.max(0,nextT-now); 
  const h=Math.floor(diff/3600000), m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
  nextLabel.innerHTML=`Next: <b>${nextP}</b> at ${format12h(nextT)} — in ${pad(h)}:${pad(m)}:${pad(s)}`;
}

// ---------- Load ----------
async function loadTimes(){
  try{
    const r=await fetch("https://api.aladhan.com/v1/timingsByCity?city=Srinagar&country=India&madhab=1");
    const d=await r.json(); let t=d.data.timings;
    const clean={};
    ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha','Sunset'].forEach(p=>{
      let val=t[p]?.match(/(\d{1,2}:\d{2})/);
      if(val) clean[p]=val[1];
    });
    clean.Dhuhr="13:00"; // force Zuhr Azan at 1:00
    const adjusted=adjustAzan(clean);
    renderTables(adjusted,applyJamatRules(adjusted));
  }catch(e){
    console.warn("API failed, fallback used");
    const adjusted=adjustAzan(sampleTimes);
    renderTables(adjusted,applyJamatRules(adjusted));
  }
}

// ---------- Init ----------
function init(){
  currentDay=new Date().getDate();
  loadTimes();
  setInterval(updateClock,1000);
}
init();
</script>
</body>
</html>
